name: Check Metal capabilities
on:
  push:
    branches: [codex/metal-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Query Metal devices
        shell: bash
        run: |
          echo "::notice title=macOS::$(sw_vers -productVersion) (build $(sw_vers -buildVersion)), $(uname -m)"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          echo "::notice title=macOS SDK::$(xcrun --sdk macosx --show-sdk-version)"
          xcrun swift scripts/metal_probe.swift 2>&1 | tee metal.log
      - name: Report failure details
        if: failure()
        shell: bash
        run: |
          detail=$(tail -c 4000 metal.log)
          detail=${detail//'%'/'%25'}
          detail=${detail//$'\n'/'%0A'}
          echo "::error title=Metal probe::$detail"
