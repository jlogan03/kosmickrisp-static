name: Check Metal capabilities
on:
  push:
    branches: [codex/metal-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Query Metal devices
        shell: bash
        run: |
          echo "::notice title=macOS::$(sw_vers -productVersion) (build $(sw_vers -buildVersion)), $(uname -m)"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          echo "::notice title=macOS SDK::$(xcrun --sdk macosx --show-sdk-version)"
          xcrun swift - <<'SWIFT' 2>&1 | tee metal.log
          import Metal
          let devices = MTLCopyAllDevices()
          print("::notice title=Metal devices::Count: \(devices.count)")
          for device in devices {
              print("::notice title=Metal device::\(device.name), Metal 4: \(device.supportsFamily(.metal4)), Apple 7: \(device.supportsFamily(.apple7)), Mac 2: \(device.supportsFamily(.mac2))")
          }
          SWIFT
